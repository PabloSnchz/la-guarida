<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐈‍⬛ La Guarida — Página de Inicio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
  <div class="layout-row">
    <!-- PANEL IZQUIERDO -->
    <aside class="side-panel side-panel--left" id="widgetsLeft">
      <!-- Widgets se renderizan acá -->
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
      <header class="header">
        <h1>🐈‍⬛ <span class="gold">La Guarida</span></h1>
        <p style="color:#a0a0a6; font-size:0.85rem; margin-top:4px;">Página de inicio personal</p>
        
        <div class="toolbar">
          <button id="editModeBtn" class="btn">✏️ Modo edición</button>
          <button id="addFavoriteBtn" class="btn btn--gold">⭐ Agregar favorito</button>
          <button id="addCategoryBtn" class="btn">📁 Agregar categoría</button>
          <button id="exportBtn" class="btn">💾 Exportar</button>
          <button id="importBtn" class="btn">📂 Importar</button>
          <input type="file" id="importFile" accept=".json" style="display:none;">
        </div>
      </header>

      <section>
        <h2 class="section-title">⭐ Favoritos</h2>
        <div class="favorites-grid" id="favoritesGrid"></div>
      </section>

      <section>
        <h2 class="section-title">📁 Categorías</h2>
        <div class="categories-grid" id="categoriesGrid"></div>
      </section>
    </div><!-- /main-content -->

    <!-- PANEL DERECHO -->
    <aside class="side-panel side-panel--right" id="widgetsRight">
      <!-- Widgets se renderizan acá -->
    </aside>
  </div><!-- /layout-row -->
</div>

<!-- MODAL -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <h3 id="modalTitle">Editar</h3>
    <div class="field">
      <label for="modalName">Nombre</label>
      <input type="text" id="modalName" placeholder="Ej: GitHub">
    </div>
    <div class="field" id="modalUrlField">
      <label for="modalUrl">URL</label>
      <input type="url" id="modalUrl" placeholder="https://...">
    </div>
    <div class="field">
      <label for="modalEmoji">Emoji (opcional, override del favicon)</label>
      <input type="text" id="modalEmoji" placeholder="🔗">
    </div>
    <div class="field">
      <label for="modalIconUrl">URL del ícono (opcional, prioridad sobre favicon)</label>
      <input type="url" id="modalIconUrl" placeholder="https://.../icon.png">
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;">
        <input type="checkbox" id="modalOpenChrome" style="width:auto;margin:0;cursor:pointer;">
        Abrir en Chrome obligatoriamente
      </label>
    </div>
    <div class="field">
      <button id="modalAutoDetectFaviconBtn" class="btn" type="button" style="width:100%;">🔍 Auto-detectar favicon</button>
    </div>
    <div class="field">
      <button id="modalDownloadFaviconBtn" class="btn" type="button" style="width:100%;">📥 Descargar como base64</button>
    </div>
    <div class="modal-actions">
      <button id="modalCancel" class="btn">Cancelar</button>
      <button id="modalSave" class="btn btn--gold">Guardar</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/widgets.js"></script>
<script src="js/drag-drop.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
