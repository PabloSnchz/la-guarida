<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐈‍⬛ La Guarida — Página de Inicio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- HEADER COMPACTO (estilo Bóveda) -->
<header class="an-header an-header--compact" role="banner">
  <div class="an-utilbar">
    <div class="an-util-left">
      <!-- Logo + nombre -->
      <div class="brand-compact">
        <img class="brand-logo-compact" src="https://raw.githubusercontent.com/PabloSnchz/gw2-wallet-ligero/main/assets/logo-gato-negro.png" alt="La Guarida" width="32" height="32">
        <span class="brand-name">La Guarida</span>
      </div>
      
      <span class="an-sep">|</span>
      
      <!-- Botón Editar -->
      <button id="editModeBtn" class="an-util-link an-util-link--btn" type="button" title="Modo edición">✏️ Editar</button>
      
      <span class="an-sep">|</span>
      
      <!-- Botones de acción -->
      <button id="addFavoriteBtn" class="an-util-link an-util-link--btn" type="button" title="Agregar favorito">⭐ Favorito</button>
      <button id="addCategoryBtn" class="an-util-link an-util-link--btn" type="button" title="Agregar categoría">📁 Categoría</button>
      
      <span class="an-sep">|</span>
      
      <!-- Links GW2 -->
      <a class="an-util-link" href="https://wiki-es.guildwars2.com/wiki/P%C3%A1gina_principal" target="_blank" rel="noopener">Wiki GW2</a>
      <a class="an-util-link" href="https://en-forum.guildwars2.com/" target="_blank" rel="noopener">Foros</a>
      <a class="an-util-link" href="https://account.arena.net/applications" target="_blank" rel="noopener">ANet Keys</a>
    </div>

    <div class="an-util-right" aria-label="Configuración y backup">
      <!-- Backup -->
      <button id="exportBtn" class="an-util-link" title="Exportar configuración" style="background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0;">
        <img src="https://raw.githubusercontent.com/PabloSnchz/gw2-wallet-ligero/main/assets/icons/155034.png" width="16" height="16" alt="Backup">
        Backup
      </button>
      
      <!-- Restaurar -->
      <button id="importBtn" class="an-util-link" title="Importar configuración" style="background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:0;">
        <img src="https://raw.githubusercontent.com/PabloSnchz/gw2-wallet-ligero/main/assets/icons/155033.png" width="16" height="16" alt="Restaurar">
        Restaurar
      </button>
      
      <input type="file" id="importFile" accept=".json" style="display:none;">
      
      <span class="an-sep">|</span>
      
      <!-- Badge Link in Bio -->
      <a href="https://pablosnchz.github.io/bio/" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;border-radius:4px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;height:26px;">
        <span style="background-color:#555555;color:#ffffff;padding:0 10px;font-size:10px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:0.3px;white-space:nowrap;height:100%;">
          <img src="https://raw.githubusercontent.com/PabloSnchz/bio/main/assets/profile.png" alt="Foto" style="width:18px;height:18px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,0.3);">
          Link in Bio
        </span>
        <span style="background-color:#E1306C;color:#ffffff;padding:0 12px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;height:100%;">
          Pablin Schez
        </span>
      </a>
    </div>
  </div>
</header>

<div class="container">
  <div class="layout-row">
    <!-- PANEL IZQUIERDO — Widgets -->
    <aside class="side-panel side-panel--left" id="widgetsLeft">
      <!-- Widgets se renderizan acá -->
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
      <section>
        <h2 class="section-title">⭐ Favoritos</h2>
        <div class="favorites-grid" id="favoritesGrid"></div>
      </section>

      <section>
        <h2 class="section-title">📁 Categorías</h2>
        <div class="categories-grid" id="categoriesGrid"></div>
      </section>
    </div><!-- /main-content -->

    <!-- PANEL DERECHO — Lanzador -->
    <aside class="side-panel side-panel--right" id="launcherPanel">
      <div class="launcher-card">
        <div class="launcher-header">
          <span class="launcher-title">🚀 Lanzador</span>
        </div>
        <div class="launcher-tabs">
          <button id="launcherTabApps" class="launcher-tab active">Apps</button>
          <button id="launcherTabGames" class="launcher-tab">Juegos</button>
        </div>
        <div class="launcher-content" id="launcherContent">
          <!-- Se renderiza con app.js -->
        </div>
      </div>
    </aside>
  </div><!-- /layout-row -->
</div>

<!-- MODAL -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <h3 id="modalTitle">Editar</h3>
    <div class="field">
      <label for="modalName">Nombre</label>
      <input type="text" id="modalName" placeholder="Ej: GitHub">
    </div>
    <div class="field" id="modalUrlField">
      <label for="modalUrl">URL</label>
      <input type="url" id="modalUrl" placeholder="https://...">
    </div>
    <div class="field" id="modalCommandField" style="display:none;">
      <label for="modalCommand">Ruta o comando</label>
      <input type="text" id="modalCommand" placeholder="C:\...\app.exe">
    </div>
    <div class="field">
      <label for="modalEmoji">Emoji (opcional)</label>
      <input type="text" id="modalEmoji" placeholder="🔗">
    </div>
    <div class="field">
      <label for="modalIconUrl">URL del ícono (opcional)</label>
      <input type="url" id="modalIconUrl" placeholder="https://.../icon.png">
    </div>
    <div class="field" id="modalOpenChromeField">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:0;">
        <input type="checkbox" id="modalOpenChrome" style="width:auto;margin:0;cursor:pointer;">
        Abrir en Chrome obligatoriamente
      </label>
    </div>
    <div class="field">
      <button id="modalAutoDetectFaviconBtn" class="btn" type="button" style="width:100%;">🔍 Auto-detectar favicon</button>
    </div>
    <div class="field">
      <button id="modalDownloadFaviconBtn" class="btn" type="button" style="width:100%;">📥 Descargar como base64</button>
    </div>
    <div class="modal-actions">
      <button id="modalCancel" class="btn">Cancelar</button>
      <button id="modalSave" class="btn btn--gold">Guardar</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/widgets.js"></script>
<script src="js/drag-drop.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
